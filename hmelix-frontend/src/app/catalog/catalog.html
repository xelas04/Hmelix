
<!-- показывает данные из signals -->

<div class="catalog">
  <p class="title">Каталог</p>

  @if (loading()) {
  <p class="catalog__load">Загрузка...</p>
  } @else if (error()) {
  <p>{{ error() }}</p>
  } @else {
    <p class="catalog__total">{{ totalLabel() }}</p>  

    <div class="container">
      <div class="container__cards">

        @for (product of products(); track product.productid) {

          <div class="card">

            <div class="card__articul">{{product.productid}}</div>
            <div class="card__name">{{ product.name }}</div>
            <div class="card__making">1 рабочий день</div>
            <div class="card__order">
              <div class="card__price">{{ product.price }} ₽</div>
              <button 
              class="card__cart-btn"
              [class.card__cart-btn--active]="isInCart(product.productid)"
              (click)="toggle(product.productid)"
              >
                <div>{{ isInCart(product.productid) ? 'В корзине' : 'В корзину' }}</div>
              </button>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="catalog__more">
      <button class="catalog__more-btn">Показать ещё</button>
    </div>

    <div class="catalog__footer">
      
    </div>

}
</div>
