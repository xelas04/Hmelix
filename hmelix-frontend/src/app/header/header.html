<!-- от routerLink смотрим в app.routes.ts -->

<header class="header">
  <div class="header__container">
    <nav class="header__nav">

      <a class="header__list-logo" routerLink="/">
        <img class="icons-hmel" src="/icons/hmel.svg">
        <span>Хмеликс</span>
      </a>
      
      <div class="header__search">
        <input
          type="text"
          class="header__search"
          placeholder=" Поиск анализов, например ферритин"
        />
      </div>

      <ul class="header__list">
        <a class="header__list-item" routerLink="/api/catalog" routerLinkActive="active">
          <img class="icons-nav" src="/icons/catalog.svg">
          <span>Каталог</span>
        </a>
        
        <a class="header__list-item" routerLink="/api/cart" routerLinkActive="active">
          <img class="icons-nav" src="/icons/cart.svg">
          <span>Корзина</span>
        </a>

        <a class="header__list-item" routerLink="/api/user" routerLinkActive="active">
          <img class="icons-nav" src="/icons/user.svg">
          <span>Войти</span>
        </a>
      </ul>

    </nav>
  </div>
</header>
