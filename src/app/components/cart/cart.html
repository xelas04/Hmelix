      <p class="cart__empty-text">Корзина пуста.</p>
      <button class="cart__empty-to-catalog-btn" routerLink="/api/catalog">
        Перейти в каталог
      </button>
    </div>
  } @else {
    <div class="cart__order">
      <div class="cart__order-left">
        <div class="cart__order-left-fields">
          <span class="cart__order-left-fields-code">КОД</span>
          <span class="cart__order-left-fields-name">АНАЛИЗ</span>
          <span class="cart__order-left-fields-price">ЦЕНА</span>
        </div>
        @for (item of items(); track item.productid) {
          <div class="cart__order-left-item">
            <span class="cart__order-left-code">{{ item.productid }} </span>
            <span class="cart__order-left-name">{{ item.name }} </span>
            <span class="cart__order-left-price">{{ item.price }} ₽</span>
          </div>
        }
      </div>
      <div class="cart__order-total">
        <p style="font-size: 14px; font-weight: 700; margin-bottom: 10px">ИТОГ</p>
        <div class="cart__order-total-ctn">
          <div class="cart__order-total-ctn-left">{{ totalLabel() }}</div>
          <div class="cart__order-total-ctn-right">{{ totalPrice() }} ₽</div>
        </div>
        <hr style="color: #201e1d8c; border: 0.5; margin-bottom: 0px" />
        <div class="cart__order-total-price">
          <div class="cart__order-total-price-left">Всего</div>
          <div class="cart__order-total-price-right">{{ totalPrice() }} ₽</div>
        </div>
        <button class="cart__order-btn" routerLink="/api/user">Оформить заказ</button>
        <div class="cart__order-to-catalog">
          <a>
            <span routerLink="/api/catalog"> Добавить ещё анализы </span>
          </a>
        </div>
      </div>
    </div>
  }
</div>
