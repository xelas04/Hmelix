openapi: 3.0.4
info:
  title: hmelix-catalog
  version: '1.0.1'
servers:
  - url: https://localhost:7162/
paths: 
  /api/v1/catalog:

    get: 
      summary: Метод получения списка продуктов
      tags: 
        - Catalog
      operationId: getAll
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Номер страницы
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Количество записей на странице
      
      responses: 
        '200':
          description: Успешный ответ со списком продуктов
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  items:
                    $ref: '#/components/schemas/Products'
                  pagination:
                    type: object
                    required:
                      - page
                      - pageSize
                    properties:
                      page: 
                        type: integer
                      pageSize:
                        type: integer
        default: 
          description: Не успешный ответ
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/search:

    get:
      summary: Метод поиска продуктов
      tags: 
        - Catalog
      operationId: search
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            minimum: 2
            maximum: 50
            description: Поиск по названию
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Номер страницы
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Количество записей на странице
      
      responses: 
        '200':
          description: 
          content: 
            application/json: 
              schema:
                type: object
                properties: 
                  items:
                    $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    required:
                      - page
                      - pageSize
                    properties:
                      page: 
                        type: integer
                      pageSize:
                        type: integer
        default: 
          description: Не успешный ответ
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'



components:
  schemas: 

    Product:
      type: object
      required:
        - name
        - price
      properties:
        product_id:
          type: integer
          example: 618
        name:
          type: string
          example: Blood
        price:
          type: number
          format: decimal
          example: 12.45

    Products:
      type: array
      items:
        $ref: '#/components/schemas/Product'

    Error:
      type: object
      required: 
        - code
        - message
      properties: 
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "Not found"
